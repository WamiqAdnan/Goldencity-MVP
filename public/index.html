<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#006eff" />
    <link rel="icon" href="/favicon.ico" />
    <link href="https://fonts.googleapis.com/css?family=Jost" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <title>GoldenCity</title>
    <script>
      // Apply the saved / preferred theme before first paint to avoid a flash of
      // the wrong theme. Mirrors the logic in src/context/ThemeContext.jsx.
      (function () {
        try {
          var stored = window.localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored === null && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
